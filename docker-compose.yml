# Local dependencies for the notification engine: Postgres, Apache Ignite, and a
# single-node Kafka in KRaft mode (no ZooKeeper).
#
#   docker compose up -d          start the infrastructure
#   ./mvnw spring-boot:run        run the app against it
#   docker compose --profile app up -d --build   run the app in Docker too
#   docker compose --profile tools up -d kafka-ui   add the Kafka web console

services:
  postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      # Override the host side if something already owns the port, which is common for
      # Postgres: POSTGRES_PORT=55432 docker compose up -d
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  ignite:
    image: apacheignite/ignite:2.18.0
    container_name: notification-ignite
    ports:
      # 10800 is the thin-client port the application connects on.
      - "${IGNITE_PORT:-10800}:10800"
    environment:
      # Ignite 2.x reaches into JDK internals that are closed by default from Java 16 on;
      # without these the node dies at startup with an InaccessibleObjectException.
      JVM_OPTS: >-
        -Xms256m -Xmx512m
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
    healthcheck:
      # The thin-client port accepting connections is what the application actually needs,
      # so that is what the check proves.
      test: ["CMD-SHELL", "nc -z localhost 10800 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.0
    container_name: notification-kafka
    ports:
      # 9092 is for clients on the host; 29092 is the in-network listener other
      # containers use, because "localhost" means something different inside each one.
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # A single-node broker cannot replicate; these keep the internal topics valid.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: notification-engine-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  app:
    profiles: ["app"]
    build: .
    container_name: notification-engine
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      IGNITE_ADDRESSES: ignite:10800
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      ignite:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka-ui:
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:latest
    container_name: notification-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
